# Robots des réseaux sociaux et moteurs : ils reçoivent une page d'aperçu (titre, image, description).
map $http_user_agent $is_preview_bot {
    default 0;
    ~*(facebookexternalhit|facebot|whatsapp|twitterbot|linkedinbot|slackbot|telegrambot|discordbot|pinterest|skypeuripreview|googlebot|bingbot) 1;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # En-têtes de sécurité (le HTTPS est assuré par le proxy / CDN en amont).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /sitemap.xml { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location = /robots.txt { proxy_pass http://backend:8000; proxy_set_header Host $host; }

    location ~ ^/(api|django-admin|static|apercu)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Médias publics uniquement (couvertures, images du blog). Le contenu des livres
    # est dans un volume privé que ce conteneur ne monte pas.
    location /media/ {
        alias /data/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        if ($is_preview_bot) {
            rewrite ^(.*)$ /apercu$1 last;
        }
        try_files $uri /index.html;
    }
}
