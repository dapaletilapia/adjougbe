# Intégration continue : tests de l'API, compilation du front, construction des images Docker.
name: CI
on:
  push:
    branches: [main, develop, "feature/**", "hotfix/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: adjougbe, POSTGRES_USER: adjougbe, POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U adjougbe" --health-interval 5s --health-retries 10
    env:
      DEBUG: "1"
      SECRET_KEY: ci-secret
      CONTENT_ENCRYPTION_KEY: Q0lfS0VZX0NJX0tFWV9DSV9LRVlfQ0lfS0VZX0NJX0s=
      DATABASE_URL: postgres://adjougbe:ci@localhost:5432/adjougbe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - run: python manage.py check --deploy --fail-level ERROR || true
        working-directory: backend
      - run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: python manage.py test tests
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t adjougbe-backend ./backend && docker build -t adjougbe-frontend ./frontend
