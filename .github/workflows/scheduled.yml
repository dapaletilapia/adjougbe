# Tâches planifiées du site hébergé sur Vercel : relances des paniers abandonnés et rappels
# de formation, toutes les 10 minutes. Secrets du dépôt requis : SITE_URL et CRON_SECRET.
name: Tâches planifiées
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler le site
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Secrets SITE_URL / CRON_SECRET absents : rien à faire."; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/scheduled/"
